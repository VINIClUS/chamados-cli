name: CLI release

on:
  push:
    tags:
      - "cli-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and contracts
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/cli/check-contracts.py
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#cli-v}" CI_COMMIT_SHA="$GITHUB_SHA" scripts/cli/build.sh .cli-dist
      - name: Verify checksums
        working-directory: .cli-dist
        run: sha256sum --check SHA256SUMS
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "chamadosctl ${GITHUB_REF_NAME#cli-v}" --generate-notes
          fi
          for artifact in .cli-dist/*; do
            gh release upload "$GITHUB_REF_NAME" "$artifact"
          done
